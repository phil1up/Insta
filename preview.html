<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tcg_h_s · Charizard G LV.X Preview</title>
  <style>
    :root {
      --bg: #0c0c0e;
      --ember: #e85c20;
      --text: #f4f4f5;
      --muted: #a1a1aa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(1200px 600px at 50% -10%, #2a1510 0%, var(--bg) 55%);
      color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 1.35rem;
      letter-spacing: 0.04em;
    }
    .sub { color: var(--muted); margin-bottom: 20px; font-size: 0.95rem; }
    .phone {
      width: min(390px, 100%);
      background: #111;
      border: 1px solid #2a2a2e;
      border-radius: 28px;
      padding: 14px 14px 18px;
      box-shadow: 0 30px 80px rgba(0,0,0,.55);
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 0.85rem;
    }
    .handle { color: var(--ember); font-weight: 600; }
    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      overflow: hidden;
      border-radius: 4px;
      background: #000;
    }
    .stage img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    .stage img.active { display: block; }
    .dots {
      display: flex;
      gap: 5px;
      justify-content: center;
      margin: 12px 0 8px;
    }
    .dots span {
      width: 6px; height: 6px; border-radius: 50%;
      background: #3f3f46;
    }
    .dots span.on { background: var(--ember); }
    .nav {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    button {
      flex: 1;
      border: 0;
      border-radius: 10px;
      padding: 12px;
      font-weight: 700;
      cursor: pointer;
      background: #1f1f23;
      color: var(--text);
    }
    button.primary { background: var(--ember); color: #fff; }
    .label {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 6px;
    }
    .grid {
      margin-top: 28px;
      width: min(920px, 100%);
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 10px;
    }
    .grid a {
      display: block;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #27272a;
      aspect-ratio: 1;
    }
    .grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
  </style>
</head>
<body>
  <h1>TCG HEALING STATION</h1>
  <div class="sub">@tcg_h_s · Charizard G LV.X · DP45 · carousel preview</div>

  <div class="phone">
    <div class="topbar">
      <span class="handle">@tcg_h_s</span>
      <span id="count">1 / 10</span>
    </div>
    <div class="stage" id="stage">
      <img class="active" src="https://raw.githubusercontent.com/phil1up/Insta/cursor/charizard-glvx-carousel-0114/slides/01_cover.jpg" alt="1 Cover" />
      <img src="https://raw.githubusercontent.com/phil1up/Insta/cursor/charizard-glvx-carousel-0114/slides/02_inspection.jpg" alt="2 Inspection" />
      <img src="https://raw.githubusercontent.com/phil1up/Insta/cursor/charizard-glvx-carousel-0114/slides/03_under_scope.jpg" alt="3 Under the scope" />
      <img src="https://raw.githubusercontent.com/phil1up/Insta/cursor/charizard-glvx-carousel-0114/slides/04_edge_whitening.jpg" alt="4 Edge whitening" />
      <img src="https://raw.githubusercontent.com/phil1up/Insta/cursor/charizard-glvx-carousel-0114/slides/05_surface_wear.jpg" alt="5 Surface wear" />
      <img src="https://raw.githubusercontent.com/phil1up/Insta/cursor/charizard-glvx-carousel-0114/slides/06_corner_damage.jpg" alt="6 Corner wear" />
      <img src="https://raw.githubusercontent.com/phil1up/Insta/cursor/charizard-glvx-carousel-0114/slides/07_promo_edge.jpg" alt="7 Promo edge" />
      <img src="https://raw.githubusercontent.com/phil1up/Insta/cursor/charizard-glvx-carousel-0114/slides/08_border_detail.jpg" alt="8 Border detail" />
      <img src="https://raw.githubusercontent.com/phil1up/Insta/cursor/charizard-glvx-carousel-0114/slides/09_holo_scuffs.jpg" alt="9 Holo scuffs" />
      <img src="https://raw.githubusercontent.com/phil1up/Insta/cursor/charizard-glvx-carousel-0114/slides/10_cta.jpg" alt="10 CTA" />
    </div>
    <div class="dots" id="dots"></div>
    <div class="label" id="label">Cover</div>
    <div class="nav">
      <button id="prev" type="button">Prev</button>
      <button id="next" class="primary" type="button">Next</button>
    </div>
  </div>

  <div class="grid">
    <a href="https://raw.githubusercontent.com/phil1up/Insta/cursor/charizard-glvx-carousel-0114/slides/01_cover.jpg"><img src="https://raw.githubusercontent.com/phil1up/Insta/cursor/charizard-glvx-carousel-0114/slides/01_cover.jpg" alt="1" /></a>
    <a href="https://raw.githubusercontent.com/phil1up/Insta/cursor/charizard-glvx-carousel-0114/slides/02_inspection.jpg"><img src="https://raw.githubusercontent.com/phil1up/Insta/cursor/charizard-glvx-carousel-0114/slides/02_inspection.jpg" alt="2" /></a>
    <a href="https://raw.githubusercontent.com/phil1up/Insta/cursor/charizard-glvx-carousel-0114/slides/03_under_scope.jpg"><img src="https://raw.githubusercontent.com/phil1up/Insta/cursor/charizard-glvx-carousel-0114/slides/03_under_scope.jpg" alt="3" /></a>
    <a href="https://raw.githubusercontent.com/phil1up/Insta/cursor/charizard-glvx-carousel-0114/slides/04_edge_whitening.jpg"><img src="https://raw.githubusercontent.com/phil1up/Insta/cursor/charizard-glvx-carousel-0114/slides/04_edge_whitening.jpg" alt="4" /></a>
    <a href="https://raw.githubusercontent.com/phil1up/Insta/cursor/charizard-glvx-carousel-0114/slides/05_surface_wear.jpg"><img src="https://raw.githubusercontent.com/phil1up/Insta/cursor/charizard-glvx-carousel-0114/slides/05_surface_wear.jpg" alt="5" /></a>
    <a href="https://raw.githubusercontent.com/phil1up/Insta/cursor/charizard-glvx-carousel-0114/slides/06_corner_damage.jpg"><img src="https://raw.githubusercontent.com/phil1up/Insta/cursor/charizard-glvx-carousel-0114/slides/06_corner_damage.jpg" alt="6" /></a>
    <a href="https://raw.githubusercontent.com/phil1up/Insta/cursor/charizard-glvx-carousel-0114/slides/07_promo_edge.jpg"><img src="https://raw.githubusercontent.com/phil1up/Insta/cursor/charizard-glvx-carousel-0114/slides/07_promo_edge.jpg" alt="7" /></a>
    <a href="https://raw.githubusercontent.com/phil1up/Insta/cursor/charizard-glvx-carousel-0114/slides/08_border_detail.jpg"><img src="https://raw.githubusercontent.com/phil1up/Insta/cursor/charizard-glvx-carousel-0114/slides/08_border_detail.jpg" alt="8" /></a>
    <a href="https://raw.githubusercontent.com/phil1up/Insta/cursor/charizard-glvx-carousel-0114/slides/09_holo_scuffs.jpg"><img src="https://raw.githubusercontent.com/phil1up/Insta/cursor/charizard-glvx-carousel-0114/slides/09_holo_scuffs.jpg" alt="9" /></a>
    <a href="https://raw.githubusercontent.com/phil1up/Insta/cursor/charizard-glvx-carousel-0114/slides/10_cta.jpg"><img src="https://raw.githubusercontent.com/phil1up/Insta/cursor/charizard-glvx-carousel-0114/slides/10_cta.jpg" alt="10" /></a>
  </div>

  <script>
    const labels = [
      "Cover", "Inspection", "Under the scope", "Edge whitening", "Surface wear",
      "Corner wear", "Promo edge", "Border detail", "Holo scuffs", "CTA"
    ];
    const imgs = [...document.querySelectorAll("#stage img")];
    const dots = document.getElementById("dots");
    imgs.forEach((_, i) => {
      const s = document.createElement("span");
      if (i === 0) s.classList.add("on");
      dots.appendChild(s);
    });
    let i = 0;
    function show(n) {
      i = (n + imgs.length) % imgs.length;
      imgs.forEach((img, idx) => img.classList.toggle("active", idx === i));
      [...dots.children].forEach((d, idx) => d.classList.toggle("on", idx === i));
      document.getElementById("count").textContent = `${i + 1} / ${imgs.length}`;
      document.getElementById("label").textContent = labels[i];
    }
    document.getElementById("prev").onclick = () => show(i - 1);
    document.getElementById("next").onclick = () => show(i + 1);
    document.getElementById("stage").onclick = () => show(i + 1);
  </script>
</body>
</html>
